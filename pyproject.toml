[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organize"
# Single-sourced from organize.py's VERSION constant so the wheel, the console
# script's --version and the dashboard banner can never disagree again.
dynamic = ["version"]
description = "The Definitive Media Management Toolkit for Jellyfin & Plex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["jellyfin", "plex", "media-management", "subtitles", "mkv", "remux", "handbrake", "mediathek", "direct-play"]
authors = [{ name = "smeltzzz" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/smeltzzz/organize"
Documentation = "https://github.com/smeltzzz/organize"
"Source Code" = "https://github.com/smeltzzz/organize"
"Bug Tracker" = "https://github.com/smeltzzz/organize/issues"
Changelog = "https://github.com/smeltzzz/organize/blob/main/CHANGELOG.md"

[project.scripts]
organize = "organize:main"

# The tools are standalone single-file scripts at the repository root, not a
# package. They must be declared explicitly: setuptools' auto-discovery finds
# no package here and would otherwise build a wheel containing nothing at all,
# leaving the `organize` console script pointing at a module that is not
# installed. `bitdepth` was named `10bit.py` until it was renamed for exactly
# this reason - a module name cannot begin with a digit.
[tool.setuptools]
py-modules = [
    "organize",
    "pipeline",
    "jellyfin_one_shot",
    "bitdepth",
    "library_auditor",
    "mkv_track_cleaner",
    "movie_standardizer",
    "subtitle_fetcher",
    "sync_subtitles",
]

[tool.setuptools.dynamic]
version = { attr = "organize.VERSION" }

[project.optional-dependencies]
# Development only (running the test suite). The runtime tools have no
# third-party dependencies at all.
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
# Make `pytest` discover the tests/ directory and put the repository root on
# sys.path so the standalone scripts (which are imported by the tests) resolve.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]
