<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Organize — the media management toolkit for Jellyfin and Plex">
  <defs>
    <linearGradient id="bnAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A4DC"/>
      <stop offset="1" stop-color="#AA5CC3"/>
    </linearGradient>
    <linearGradient id="bnCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="bnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111B2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="bnGlow" cx="0.14" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0E2C42" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnGlowR" cx="0.88" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#251A3D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="1272" height="312" rx="28" fill="url(#bnBg)"/>
  <rect x="4" y="4" width="1272" height="312" rx="28" fill="url(#bnGlow)"/>
  <rect x="4" y="4" width="1272" height="312" rx="28" fill="url(#bnGlowR)"/>
  <rect x="5.5" y="5.5" width="1269" height="309" rx="27" fill="none" stroke="url(#bnAccent)" stroke-width="3" opacity="0.65"/>

  <!-- film perforations, bottom edge -->
  <g fill="url(#bnAccent)" opacity="0.26">
    <rect x="48" y="282" width="34" height="12" rx="4"/><rect x="94" y="282" width="34" height="12" rx="4"/>
    <rect x="140" y="282" width="34" height="12" rx="4"/><rect x="186" y="282" width="34" height="12" rx="4"/>
    <rect x="232" y="282" width="34" height="12" rx="4"/><rect x="278" y="282" width="34" height="12" rx="4"/>
    <rect x="324" y="282" width="34" height="12" rx="4"/><rect x="370" y="282" width="34" height="12" rx="4"/>
    <rect x="416" y="282" width="34" height="12" rx="4"/><rect x="462" y="282" width="34" height="12" rx="4"/>
    <rect x="508" y="282" width="34" height="12" rx="4"/><rect x="554" y="282" width="34" height="12" rx="4"/>
    <rect x="600" y="282" width="34" height="12" rx="4"/><rect x="646" y="282" width="34" height="12" rx="4"/>
    <rect x="692" y="282" width="34" height="12" rx="4"/><rect x="738" y="282" width="34" height="12" rx="4"/>
    <rect x="784" y="282" width="34" height="12" rx="4"/><rect x="830" y="282" width="34" height="12" rx="4"/>
    <rect x="876" y="282" width="34" height="12" rx="4"/><rect x="922" y="282" width="34" height="12" rx="4"/>
    <rect x="968" y="282" width="34" height="12" rx="4"/><rect x="1014" y="282" width="34" height="12" rx="4"/>
    <rect x="1060" y="282" width="34" height="12" rx="4"/><rect x="1106" y="282" width="34" height="12" rx="4"/>
    <rect x="1152" y="282" width="34" height="12" rx="4"/><rect x="1198" y="282" width="34" height="12" rx="4"/>
  </g>

  <!-- emblem: stacked movie cases + play -->
  <g transform="translate(84,36)">
    <rect x="64" y="8" width="188" height="138" rx="20" fill="none" stroke="#7C5CC3" stroke-width="10" opacity="0.38"/>
    <rect x="55" y="28" width="188" height="138" rx="20" fill="none" stroke="#00A4DC" stroke-width="10" opacity="0.62"/>
    <rect x="46" y="50" width="190" height="140" rx="20" fill="#101A2C"/>
    <rect x="46" y="50" width="190" height="140" rx="20" fill="none" stroke="url(#bnAccent)" stroke-width="11"/>
    <path d="M 121 87 L 121 153 C 121 158 127 161 131 158 L 178 127 C 182 124 182 118 178 115 L 131 84 C 127 81 121 84 121 87 Z" fill="url(#bnCase)"/>
    <rect x="76" y="212" width="148" height="10" rx="5" fill="url(#bnAccent)" opacity="0.85"/>
    <rect x="101" y="229" width="98" height="8" rx="4" fill="#00A4DC" opacity="0.45"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="470" y="150" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="1" fill="#F0F6FC">Organize</text>
  <text x="474" y="196" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#8FB8D4">The definitive media management toolkit for Jellyfin &amp; Plex</text>
  <rect x="474" y="218" width="700" height="6" rx="3" fill="url(#bnAccent)" opacity="0.9"/>
</svg>
