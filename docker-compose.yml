# ==============================================================================
# Organize — Docker Compose Configuration
# ==============================================================================
# Run as an on-demand container or periodic scheduled maintenance container:
#
#   docker compose run --rm organize doctor
#   docker compose run --rm organize run --dry-run
#   docker compose run --rm organize run
#   docker compose run --rm organize audit
#
# For a nightly schedule, prefer cron/systemd on the host or a scheduler that
# invokes `docker compose run --rm organize run --nice` (see
# docs/LINUX_DOCKER_GUIDE.md).
# ==============================================================================

services:
  organize:
    build:
      context: .
      dockerfile: Dockerfile
    image: organize:latest
    container_name: organize
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Subtitle providers (OpenSubtitles is hash-match primary; SubDL is a score-gated release fallback)
      # https://www.opensubtitles.com/en/consumers
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      # https://subdl.com/panel/api
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}
      # Library roots INSIDE the container. Both live under the single /media
      # mount below, so hardlink-only ingestion works.
      - MOVIE_STD_SOURCE=/media/torrents/final
      - MOVIE_STD_TARGET=/media/torrents/final_organized
      - MOVIE_STD_LOG=/config/movie_standardizer.log
      - MOVIE_STD_REPORT=/config/movie_standardizer_report.txt
    volumes:
      # IMPORTANT: mount the COMMON PARENT of downloads and library, not the
      # two folders separately. Hardlinks cannot cross filesystem mounts, so a
      # single mount of the shared root keeps them on one device.
      #   /mnt/storage/torrents/final          -> downloads (qBittorrent)
      #   /mnt/storage/torrents/final_organized -> the Jellyfin library
      - /mnt/storage:/media
      # Logs, reports, and probe caches persist outside the container.
      - ./config:/config
    command: ["doctor"]
