# Publish a release to PyPI, from a tag, with nothing to type and no token to
# leak.
#
# The trigger is a pushed tag (`v3.6.0`). The job re-runs the full offline
# suite before it builds anything, because a release is the one artifact nobody
# can quietly fix afterwards: a version on PyPI is immutable, and a broken
# 3.6.0 can only be answered with 3.6.1.
#
# Authentication is PyPI Trusted Publishing (OIDC): the `id-token: write`
# permission below lets GitHub mint a short-lived credential for this exact
# repository, workflow and environment, so there is no API token in the
# repository secrets to rotate or steal. Configure the publisher once at
# https://pypi.org/manage/project/organizekit/settings/publishing/ with:
#   owner smeltzzz · repository organize · workflow release.yml · environment pypi
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: The suite must pass before anything is built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python organize.py test
      - run: python -m unittest discover -s tests -p "test_*.py"

  build:
    name: Build the wheel, the sdist and the zipapp
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag must match organizekit.VERSION
        # A tag that disagrees with the package is how 3.6.0 ends up on PyPI
        # calling itself 3.5.0, which cannot be undone.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import organizekit; print(organizekit.VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag != VERSION $version"; exit 1; }

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: The metadata must render on PyPI
        run: python -m twine check dist/*

      - name: The wheel must install and run from a clean environment
        run: |
          python -m venv /tmp/checkinstall
          /tmp/checkinstall/bin/pip install dist/*.whl
          cd /tmp && /tmp/checkinstall/bin/organize --version
          cd /tmp && /tmp/checkinstall/bin/organize doctor --json > /dev/null

      - name: The sdist must carry a suite that runs
        # Not a formality: setuptools ships tests/test_*.py by default and
        # leaves their fixtures behind, which yields a distribution whose tests
        # cannot even be collected.
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m unittest discover -s tests -p "test_*.py"

      - name: The zipapp ships with the release too
        run: python scripts/build_pyz.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/organize.pyz

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/organizekit
    permissions:
      id-token: write   # Trusted Publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: The zipapp is a GitHub asset, not a PyPI one
        run: rm -f dist/organize.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of this workflow — to re-attach a release's assets, say —
          # must not fail because PyPI already holds the files. The only build
          # this tag can produce is the one already published, so re-publishing
          # the same version is a no-op, not a second release.
          skip-existing: true

  github-release:
    name: Attach the artifacts to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Create the release
        # `gh` ships with the runners, so this step needs no third-party action
        # pinned for a job that only publishes files. `--generate-notes` is the
        # same release text action-gh-release produced.
        #
        # GH_REPO is load-bearing, not decoration: this job has no checkout (the
        # artifacts arrive via download-artifact), so without it gh has no
        # repository to talk to and dies with "fatal: not a git repository"
        # before it reaches the API. That is exactly how v8.6.3's first run
        # failed, with PyPI already accepting the release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "organizekit ${GITHUB_REF_NAME#v}" \
              --generate-notes

      - name: Attach the three artifacts, retrying the upload host
        # v8.6.2 died in exactly this place: the asset upload answered "Too many
        # retries." *after* PyPI had already accepted the release, leaving a
        # published version with an empty GitHub release beside it. The upload
        # host is flaky in a way that has nothing to do with this repository, so
        # the step retries with a growing backoff instead of failing the run on
        # the first bad minute — and `--clobber` makes every retry (and any
        # manual re-run) idempotent rather than an "asset already exists" error.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$GITHUB_REF_NAME" dist/* --clobber; then
              echo "assets attached on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; backing off"
            sleep $((attempt * 15))
          done
          echo "::error::the release exists, but its assets could not be attached"
          exit 1
