# Continuous Integration — runs the entire offline test suite on every push
# and pull request across all supported platforms and Python versions.
#
# The suite is deliberately hermetic: no media files, no mkvtoolnix, no ffprobe,
# no OpenSubtitles API key, and no network access are required.
#
# Hermetic means the suite does not *need* those things, not that it is blind to
# them - a runner has none of them installed, so a test that behaves differently
# when a binary is present would never be caught here. The `provisioned` job at
# the bottom installs the real toolchain and runs the same suite against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the package and every script (syntax gate)
        run: >-
          python -m compileall -q organizekit
          organize.py pipeline.py bitdepth.py
          library_auditor.py mkv_track_cleaner.py movie_standardizer.py
          subtitle_extractor.py

      - name: A clone must run with no install and no PYTHONPATH
        run: python -c "import bitdepth, organizekit.core; assert bitdepth.Report is organizekit.core.Report"

      - name: Built-in self-tests (one per tool)
        run: python organize.py test

      - name: Unit test suite (fully offline)
        run: python -m unittest discover -s tests -p "test_*.py"

  lint:
    # ruff has been configured in pyproject.toml for a long time but was never
    # actually run anywhere. It passes clean today; this keeps it that way.
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .

  coverage:
    # A floor, not a target. Raise `--fail-under` whenever the real number
    # comfortably clears it so coverage can only ratchet upwards.
    # 55 -> 65 when the tools' self-tests moved into tests/selftests/: they had
    # always been production lines that the unit suite never executed, which
    # depressed the number by ~9 points while testing nothing extra.
    # 65 -> 72 with the crash-safety, end-to-end and destructive-path suites.
    # The suite measures 75% on this runner; the floor keeps a few points of
    # slack because the end-to-end remux tests are skipped off POSIX.
    # 88 -> 85 with the 4.0.0 deletions (subtitle fetching, then the one-shot
    # runner): that code was 100%-covered and deleted with its tests, and the
    # suite measures 86% without it. The floor keeps its point of slack; it
    # is a ratchet - raise it again in a later testing pass, never lower it.
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install coverage
      - name: Run suite under coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py"
      - name: Report and enforce the floor
        run: |
          python -m coverage report
          python -m coverage report --fail-under=85

  packaging:
    # Regression guard for the broken console entry point: pyproject declared
    # `organize = "organize:main"` with no build backend and no package, so the
    # install succeeded and the command then died with ModuleNotFoundError.
    # Every other job runs `python organize.py` by path and cannot see that.
    name: Packaging (install + console script)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build a wheel and install it
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
        shell: bash
      - name: The console script must work from OUTSIDE the source tree
        working-directory: ${{ runner.temp }}
        run: |
          organize --version
          organize doctor
          organize audit --help
        shell: bash
      - name: The shared core must be importable from the wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import organizekit.core as c; assert c.Report and c.atomic_write_text"
        shell: bash
      - name: The wheel's version must match organizekit.VERSION
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import importlib.metadata as m, organizekit, sys
          wheel, src = m.version('organizekit'), organizekit.VERSION
          print(f'wheel={wheel} source={src}')
          sys.exit(0 if wheel == src else 1)
          "
        shell: bash

  single-file:
    # The other install path: one file copied to a machine with nothing on it
    # but Python. The archive has no script files in it, so this is also the
    # regression guard for the launcher - a step that cannot start is the
    # failure mode, and only a real archive shows it.
    name: Single-file build (organize.pyz)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the archive
        run: python scripts/build_pyz.py
        shell: bash
      - name: It must work from OUTSIDE the source tree
        run: |
          cp dist/organize.pyz "${{ runner.temp }}/organize.pyz"
          cd "${{ runner.temp }}"
          python organize.pyz --version
          python organize.pyz doctor
          python organize.pyz test
        shell: bash
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: organize-pyz
          path: dist/organize.pyz

  doctor-smoke:
    # Verifies the unified CLI boots and the diagnostic doctor runs green-box
    # on a pristine machine (no binaries, no API key — warnings, not crashes).
    name: CLI smoke test (doctor + dashboard)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dashboard renders with no arguments
        run: python organize.py
      - name: Doctor exits 0 on a bare machine
        run: python organize.py doctor
      - name: Pipeline step listing works
        run: python pipeline.py --list-steps

  provisioned:
    # The one machine shape the matrix above never tests: a real workstation,
    # where MKVToolNix and FFmpeg are actually installed. Every
    # other job runs on a runner that has none of them, so a test that quietly
    # takes a different code path when a binary is present - resolving a real
    # mkvmerge instead of bailing out, launching a real ffprobe instead of the
    # fake one on PATH - passes nine times over and still fails for the person
    # who has the tools. That is the machine this toolkit is written for, so it
    # gets a job of its own.
    #
    # The suite is hermetic by design; this job asserts that the hermeticity
    # holds with the toolchain installed rather than because of its absence.
    name: Full toolchain installed (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MKVToolNix and FFmpeg
        run: choco install mkvtoolnix ffmpeg -y --no-progress
        shell: bash

      - name: Every tool must be discoverable the way the tools discover it
        # Not a bare `shutil.which` for all four: MKVToolNix's Windows installer
        # does not put itself on PATH, and the tools do not ask PATH either -
        # they ask their own resolvers, which also search the standard install
        # locations. Asking PATH here would fail on a correctly provisioned
        # machine, which is exactly the drift this job exists to catch.
        run: |
          python -c "
          import shutil, sys
          import bitdepth, mkv_track_cleaner as tc
          import subtitle_extractor as sx
          try:
              mkvmerge = tc.resolve_mkvmerge_path()
          except OSError as exc:
              mkvmerge = None
              print('mkvmerge   ', exc)
          found = {
              'mkvmerge': mkvmerge,
              'mkvextract': sx.find_mkvtoolnix_binary('mkvextract'),
              'ffmpeg': shutil.which('ffmpeg'),
              'ffprobe': bitdepth.find_ffprobe(),
          }
          for name, path in found.items():
              print(f'{name:11} {path or \"NOT FOUND\"}')
          missing = [n for n, p in found.items() if not p]
          sys.exit(f'this job is meaningless without: {missing}' if missing else 0)
          "
        shell: bash

      - name: Unit test suite with every tool installed
        run: python -m unittest discover -s tests -p "test_*.py"
